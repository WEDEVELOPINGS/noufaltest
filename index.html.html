<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline Day — 5-a-Side Auction Draft</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Karla:wght@400;500;700;800&display=swap');

:root{
  --pitch-dark:#0d2818;
  --pitch:#123a22;
  --pitch-line: rgba(255,255,255,0.055);
  --parchment:#f2e8cf;
  --parchment-2:#e9dcb8;
  --ink:#1b2a20;
  --ink-soft:#4a5a4c;
  --gold:#c9a227;
  --gold-bright:#e9c34a;
  --claret:#8c2f39;
  --claret-bright:#b23a46;
  --silver:#aeb7bd;
  --panel:#163d26;
  --panel-line: rgba(242,232,207,0.12);
  --white: #f7f4ec;
  --radius: 10px;
  --font-display: 'Anton', sans-serif;
  --font-body: 'Karla', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: var(--font-body);
  color: var(--white);
  background:
    repeating-linear-gradient(90deg, var(--pitch-line) 0px, var(--pitch-line) 1px, transparent 1px, transparent 64px),
    radial-gradient(ellipse 140% 90% at 50% -10%, var(--pitch) 0%, var(--pitch-dark) 70%);
  min-height:100vh;
  background-color: var(--pitch-dark);
}
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 28px 16px 60px;
}

.eyebrow{ font-family: var(--font-mono); letter-spacing: 3px; font-size: 11px; color: var(--gold-bright); text-transform:uppercase; opacity:0.9; }
.h1{ font-family: var(--font-display); font-size: clamp(34px, 6vw, 56px); letter-spacing: 1px; margin: 4px 0 0; line-height: 1; text-transform: uppercase; color: var(--white); }
.h1 .accent{ color: var(--gold-bright); }
.sub{ color: var(--silver); font-size: 14px; margin-top: 8px; max-width: 480px; text-align:center; line-height:1.5;}

.panel{ background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
.stack{ display:flex; flex-direction:column; gap:14px; width:100%; }

input[type=text], input[type=number], input[type=checkbox]{
  background: rgba(0,0,0,0.25); border: 1px solid var(--panel-line); color: var(--white);
  font-family: var(--font-body); font-weight:700; font-size: 16px; padding: 12px 14px;
  border-radius: 8px; outline:none; width:100%; letter-spacing: 0.5px;
}
input::placeholder{ color: rgba(247,244,236,0.4); font-weight:500;}
input:focus{ border-color: var(--gold); }
input[type=checkbox] { width: auto; margin-right: 8px; cursor: pointer; }

button{
  font-family: var(--font-body); font-weight: 800; font-size: 14px; letter-spacing: 0.3px;
  border: none; border-radius: 8px; padding: 13px 18px; cursor:pointer; transition: transform .12s ease, filter .12s ease;
}
button:active{ transform: translateY(1px) scale(0.99); }
button:disabled{ opacity:0.35; cursor:not-allowed; filter:none !important; }

.btn-primary{ background: var(--gold); color: #201703; }
.btn-primary:hover:not(:disabled){ filter: brightness(1.08); }
.btn-claret{ background: var(--claret); color: var(--white); }
.btn-claret:hover:not(:disabled){ filter: brightness(1.12); }
.btn-ghost{ background: transparent; color: var(--white); border: 1px solid var(--panel-line); }
.btn-ghost:hover:not(:disabled){ border-color: var(--gold); color: var(--gold-bright); }
.btn-full{ width:100%; }

.landing-wrap{ display:flex; flex-direction:column; align-items:center; gap:26px; width:100%; max-width: 420px; margin-top: 18px;}
.mode-toggle{ display:flex; width:100%; background: rgba(0,0,0,0.25); border-radius: 8px; padding:4px; gap:4px; }
.mode-toggle button{ flex:1; background:transparent; color: var(--silver); padding: 10px; }
.mode-toggle button.active{ background: var(--gold); color:#201703; }

.room-code-display{ font-family: var(--font-mono); font-size: 34px; font-weight:700; letter-spacing: 6px; color: var(--gold-bright); text-align:center; padding: 14px; background: rgba(0,0,0,0.25); border-radius: 8px; border: 1px dashed var(--gold); }
.roster{ display:flex; flex-direction:column; gap:8px; width:100%; }
.roster-row{ display:flex; align-items:center; justify-content:space-between; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px 14px; font-weight:700; }
.roster-row .tag{ font-family: var(--font-mono); font-size:11px; color: var(--gold-bright); letter-spacing:1px; }

.auction-layout{ display:grid; grid-template-columns: 1fr; gap: 22px; width:100%; max-width: 1080px; }
@media (min-width: 900px){ .auction-layout{ grid-template-columns: 300px 1fr 300px; align-items:start; } }
.topbar{ display:flex; justify-content:space-between; align-items:center; width:100%; max-width:1080px; margin-bottom: 18px; flex-wrap:wrap; gap:10px; }
.pill{ font-family: var(--font-mono); font-size:12px; letter-spacing:1px; background: rgba(0,0,0,0.25); padding: 8px 14px; border-radius:20px; border: 1px solid var(--panel-line); color: var(--silver); }
.pill b{ color: var(--gold-bright); }

.sticker-stage{ perspective: 1200px; display:flex; flex-direction:column; align-items:center; gap:18px; }
.sticker{
  width: 280px; height: 360px; border-radius: 16px; position:relative; overflow: hidden;
  background: linear-gradient(160deg, var(--parchment) 0%, var(--parchment-2) 100%);
  color: var(--ink); display:flex; flex-direction:column; padding: 18px;
  border: 4px solid var(--silver); box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.4);
  /* Bug Fix: Removed looping animation here */
}
.sticker-bg-image { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity: 0.3; z-index: 0; }
.sticker-content { position: relative; z-index: 1; display:flex; flex-direction:column; height: 100%; }
.sticker.legend{ border-color: var(--gold); box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px var(--gold), 0 0 24px rgba(201,162,39,0.35); }
.sticker-tier{ font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform:uppercase; color: var(--claret); font-weight:700; }
.sticker.legend .sticker-tier{ color: var(--gold); }
.sticker-pos{ position:absolute; top:14px; right:14px; font-family: var(--font-display); font-size: 15px; background: var(--ink); color: var(--parchment); padding: 4px 10px; border-radius: 6px; letter-spacing:1px; z-index: 2;}
.sticker-initials{ flex:1; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-size: 74px; color: rgba(27,42,32,0.3); letter-spacing: 2px; }
.sticker-name{ font-family: var(--font-display); font-size: 26px; line-height:1.05; text-transform:uppercase; margin-top: 4px; }
.sticker-club{ font-size:12px; font-weight:700; color: var(--ink-soft); margin-top:2px; }

.timer{ font-family: var(--font-mono); font-size: 44px; font-weight:700; color: var(--white); letter-spacing: 2px; }
.timer.urgent{ color: var(--claret-bright); animation: pulse .5s infinite alternate; }
@keyframes pulse{ from{ opacity:1; } to{ opacity:0.55; } }

.current-bid-box{ text-align:center; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 14px 22px; min-width: 220px; border: 1px solid var(--panel-line); }
.current-bid-amount{ font-family: var(--font-display); font-size: 40px; color: var(--gold-bright); letter-spacing:1px; }
.current-bid-by{ font-size:13px; color: var(--silver); margin-top:2px; }

.bid-controls{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; }
.bid-row{ display:flex; gap:8px; }
.bid-row button{ flex:1; }
.bid-custom{ display:flex; gap:8px; }
.bid-custom input{ flex:1; }
.bid-custom button{ white-space:nowrap; }

.sidebar-title{ font-family: var(--font-mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color: var(--gold-bright); margin-bottom:10px; }
.team-card{ background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--panel-line); }
.team-card.me{ border-color: var(--gold); }
.team-card-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.team-card-name{ font-weight:800; }
.team-card-budget{ font-family: var(--font-mono); font-size:13px; color: var(--gold-bright); }
.team-slots{ display:flex; gap:4px; flex-wrap:wrap; }
.slot{ font-size: 10px; font-family: var(--font-mono); background: rgba(255,255,255,0.08); padding: 3px 7px; border-radius: 5px; color: var(--silver); }
.slot.filled{ background: var(--gold); color:#201703; font-weight:700; }

.sold-overlay{ position:fixed; inset:0; background: rgba(5,15,9,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index: 50; gap: 10px; text-align:center; padding:20px; animation: fadeIn .25s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.sold-stamp{ font-family: var(--font-display); font-size: clamp(48px,10vw,90px); color: var(--gold-bright); letter-spacing:4px; text-transform:uppercase; transform: rotate(-4deg); border: 6px solid var(--gold-bright); padding: 6px 26px; }
.sold-unsold{ color: var(--claret-bright); border-color: var(--claret-bright); }
.sold-detail{ font-size:18px; color: var(--white); font-weight:700; }
.sold-detail b{ color: var(--gold-bright); }

.finished-grid{ display:grid; grid-template-columns: 1fr; gap: 18px; width:100%; max-width: 900px; }
@media(min-width:700px){ .finished-grid{ grid-template-columns: 1fr 1fr; } }
.final-squad-title{ display:flex; justify-content:space-between; align-items:center; }
.final-player-row{ display:flex; justify-content:space-between; padding: 7px 0; border-bottom: 1px dashed var(--panel-line); font-size:14px;}
.final-player-row:last-child{ border-bottom:none; }
.crown{ font-size:12px; color: var(--gold-bright); font-family:var(--font-mono); letter-spacing:1px; }
.footnote{ font-size:12px; color: rgba(247,244,236,0.45); text-align:center; margin-top: 20px; max-width:480px; }
.error-text{ color: var(--claret-bright); font-size:13px; font-weight:700; min-height:16px; text-align: center; }

/* Sim section omitted for brevity but remains unchanged visually */
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

// ---------------- constants ----------------
var BUDGET_START = 50000;
var SQUAD_SIZE = 5;
var AUCTION_SECONDS = 15;
var SOLD_BANNER_MS = 2600;
var POLL_MS = 1500;
var HOST_TICK_MS = 900;

// Add 'img' URLs here for your FC Cards!
var PLAYERS = [
  {id:"p1", name:"Peter Schmeichel", pos:"GK", club:"Man Utd", tier:"Legend", img:"https://cdn.futbin.com/content/FIFA24/items/players/new/109403.png"}, 
  {id:"p2", name:"David Seaman", pos:"GK", club:"Arsenal", tier:"Legend", img:""},
  {id:"p5", name:"Rio Ferdinand", pos:"DEF", club:"Man Utd", tier:"Legend", img:""},
  {id:"p11", name:"Steven Gerrard", pos:"MID", club:"Liverpool", tier:"Legend", img:""},
  {id:"p17", name:"Thierry Henry", pos:"FWD", club:"Arsenal", tier:"Legend", img:""},
  {id:"p23", name:"Alisson Becker", pos:"GK", club:"Liverpool", tier:"Current", img:""},
  {id:"p27", name:"Virgil van Dijk", pos:"DEF", club:"Liverpool", tier:"Current", img:""},
  {id:"p33", name:"Declan Rice", pos:"MID", club:"Arsenal", tier:"Current", img:""},
  {id:"p39", name:"Erling Haaland", pos:"FWD", club:"Man City", tier:"Current", img:""}
  // Add the rest of your players here exactly like before...
];
var PLAYERS_BY_ID = {};
PLAYERS.forEach(function(p){ PLAYERS_BY_ID[p.id] = p; });

var myId = (crypto.randomUUID ? crypto.randomUUID() : ("id-"+Math.random().toString(36).slice(2)));
var myName = "";
var roomCode = "";
var pollTimer = null, hostTimer = null, hostBusy = false;
var lastRoom = null, joinError = "", landingMode = "create", soldBannerUntil = 0;

function fmt(n){ return "$" + Math.max(0,Math.round(n)).toLocaleString("en-US"); }
function genCode(){ return Math.random().toString(36).slice(2,7).toUpperCase(); }
function initials(name){ return name.split(" ").map(w=>w[0]).join("").slice(0,3).toUpperCase(); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function squadCount(pl){ return (pl && pl.squad) ? pl.squad.length : 0; }
function maxAllowedBid(pl){ return Math.max(0, pl.budget - Math.max(0, (SQUAD_SIZE - squadCount(pl) - 1))*1000); }
function isRoomFull(room){ var ids=Object.keys(room.players); return ids.length>0 && ids.every(id=>squadCount(room.players[id])>=SQUAD_SIZE); }

// ADD YOUR SUPABASE CREDS BACK HERE
var SUPABASE_URL = "https://ehenlyupymzyzkvljxaq.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_da9yxtKoXaA2bRHEBA5Ndg_EnCfmvX5";

function supabaseHeaders(){ return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer "+SUPABASE_ANON_KEY, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates,return=minimal" }; }

function saveRoom(room){
  room.updatedAt = Date.now();
  return fetch(SUPABASE_URL + "/rest/v1/rooms?on_conflict=code", {
    method: "POST", headers: supabaseHeaders(), body: JSON.stringify([{ code: room.code, data: room, updated_at: new Date().toISOString() }])
  }).then(r=>room).catch(e=>null);
}
function loadRoom(code){
  return fetch(SUPABASE_URL + "/rest/v1/rooms?code=eq." + code + "&select=data", { method: "GET", headers: supabaseHeaders() })
  .then(r=>r.json()).then(rows=>(rows && rows.length) ? rows[0].data : null).catch(e=>null);
}

function render(){
  var app = document.getElementById("app"); app.innerHTML = "";
  if (!lastRoom){ app.appendChild(renderLanding()); return; }
  var room = lastRoom;
  if (room.status === "lobby") app.appendChild(renderLobby(room)); 
  else if (room.status === "finished") app.appendChild(renderFinished(room)); 
  else app.appendChild(renderAuction(room));

  if (room.status === "sold" && Date.now() < soldBannerUntil) app.appendChild(renderSoldOverlay(room));
}

function renderLanding(){
  var wrap = el('<div class="landing-wrap"></div>');
  wrap.appendChild(el('<div style="text-align:center;"><div class="eyebrow">Transfer Deadline</div><div class="h1">5-A-SIDE<br><span class="accent">DRAFT</span></div></div>'));
  var toggle = el('<div class="mode-toggle"><button id="mode-create" class="'+(landingMode==="create"?"active":"")+'">Create</button><button id="mode-join" class="'+(landingMode==="join"?"active":"")+'">Join</button></div>');
  wrap.appendChild(toggle);
  toggle.querySelector("#mode-create").onclick = function(){ landingMode="create"; render(); };
  toggle.querySelector("#mode-join").onclick = function(){ landingMode="join"; render(); };

  var panel = el('<div class="panel stack"></div>');
  panel.appendChild(el('<input type="text" id="name-input" placeholder="Your name">'));
  if (landingMode === "join") panel.appendChild(el('<input type="text" id="code-input" placeholder="Room code">'));
  panel.appendChild(el('<div class="error-text">'+joinError+'</div>'));
  
  var btn = el('<button class="btn-primary btn-full">Go</button>');
  btn.onclick = function(){
    myName = (panel.querySelector("#name-input").value || "").trim();
    if(!myName) return;
    if (landingMode==="create"){
      var code = genCode();
      var room = { code: code, hostId: myId, status: "lobby", players: {}, pool: [], poolIndex: 0, soldIds: [], current: null, allowLegends: true };
      room.players[myId] = { id: myId, name: myName, budget: BUDGET_START, squad: [] };
      saveRoom(room).then(r=>{ roomCode = code; lastRoom = room; startPolling(); render(); });
    } else {
      var code = (panel.querySelector("#code-input").value||"").trim().toUpperCase();
      loadRoom(code).then(room=>{
        if(!room) return;
        if(!room.players[myId]) room.players[myId] = { id: myId, name: myName, budget: BUDGET_START, squad: [] };
        saveRoom(room).then(r=>{ roomCode = code; lastRoom = room; startPolling(); render(); });
      });
    }
  };
  panel.appendChild(btn); wrap.appendChild(panel); return wrap;
}

function renderLobby(room){
  var wrap = el('<div class="landing-wrap"></div>');
  wrap.appendChild(el('<div class="room-code-display">'+room.code+'</div>'));
  
  // Disable Legends Toggle for Host
  if (room.hostId === myId) {
      var options = el('<div style="margin: 10px 0px; text-align: center;"><label style="font-size: 14px; font-weight: bold;"><input type="checkbox" id="legends-toggle" '+(room.allowLegends?'checked':'')+'> Include Legends</label></div>');
      options.querySelector('input').onchange = function(e){ room.allowLegends = e.target.checked; saveRoom(room); };
      wrap.appendChild(options);
      
      var btn = el('<button class="btn-primary btn-full">Start Auction</button>');
      btn.onclick = function(){
          var poolList = PLAYERS;
          if (!room.allowLegends) poolList = PLAYERS.filter(p => p.tier !== "Legend");
          room.pool = shuffle(poolList.map(p => p.id));
          room.status = "auction";
          saveRoom(room).then(() => advanceToNextPlayer(room));
      };
      wrap.appendChild(btn);
  }
  return wrap;
}

// Goalkeeper Logic applied when pulling next player
function advanceToNextPlayer(room){
  if (isRoomFull(room)){ room.status = "finished"; room.current = null; saveRoom(room); return; }
  
  // Check if anyone needs a GK for their final slot
  var needsGk = false;
  Object.keys(room.players).forEach(function(pid){
      var p = room.players[pid];
      var hasGk = p.squad.some(s => s.pos === "GK");
      if (p.squad.length === SQUAD_SIZE - 1 && !hasGk) needsGk = true;
  });

  var foundId = null;
  for (var i = 0; i < room.pool.length; i++){
      var pid = room.pool[i];
      if (room.soldIds.indexOf(pid) === -1) {
          if (needsGk && PLAYERS_BY_ID[pid].pos !== "GK") continue; // Skip non-GKs if forced
          foundId = pid;
          break;
      }
  }

  if (!foundId){ room.status = "finished"; room.current = null; saveRoom(room); return; }

  room.soldIds.push(foundId); // mark as being shown
  room.status = "auction";
  room.soldInfo = null;
  room.current = { playerId: foundId, endTime: Date.now() + (AUCTION_SECONDS*1000), bid: { amount: 0 }, passedIds: [] };
  saveRoom(room);
}

function renderAuction(room){
  var wrap = el('<div style="display:flex;flex-direction:column;align-items:center;width:100%;"></div>');
  var layout = el('<div class="auction-layout" style="margin-top: 30px;"></div>');
  var center = el('<div class="sticker-stage"></div>');
  
  if (room.current){
    var pdef = PLAYERS_BY_ID[room.current.playerId];
    
    // Updated Sticker HTML for Images
    var sticker = el(
      '<div class="sticker'+(pdef.tier==="Legend"?" legend":"")+'">'+
        (pdef.img ? '<img src="'+pdef.img+'" class="sticker-bg-image">' : '') +
        '<div class="sticker-pos">'+pdef.pos+'</div>'+
        '<div class="sticker-content">'+
            '<div class="sticker-tier">'+pdef.tier+'</div>'+
            '<div class="sticker-initials">'+(pdef.img ? '' : initials(pdef.name))+'</div>'+
            '<div class="sticker-name">'+pdef.name+'</div>'+
            '<div class="sticker-club">'+pdef.club+'</div>'+
        '</div>'+
      '</div>'
    );
    center.appendChild(sticker);
    
    var secsLeft = Math.max(0, Math.ceil((room.current.endTime - Date.now())/1000));
    center.appendChild(el('<div class="timer">'+secsLeft+'s</div>'));

    var controls = el('<div class="bid-controls"></div>');
    var me = room.players[myId];
    
    // Check if player is forced to buy a GK
    var hasGk = me.squad.some(s => s.pos === "GK");
    var needsGkForLastSlot = (me.squad.length === SQUAD_SIZE - 1) && !hasGk;
    var isCurrentGk = pdef.pos === "GK";

    if (needsGkForLastSlot && !isCurrentGk) {
        controls.appendChild(el('<div class="error-text">You must save your final slot for a Goalkeeper!</div>'));
    } else {
        var bidBtn = el('<button class="btn-primary">Bid +$1,000</button>');
        bidBtn.onclick = function(){ placeBid(room, (room.current.bid.amount || 0) + 1000); };
        
        // Skip Button
        var passBtn = el('<button class="btn-claret">Pass / Fold</button>');
        passBtn.onclick = function(){ placePass(room); };
        
        var row = el('<div class="bid-row"></div>');
        row.appendChild(bidBtn);
        row.appendChild(passBtn);
        controls.appendChild(row);
    }
    center.appendChild(controls);
  }
  layout.appendChild(center);
  wrap.appendChild(layout);
  return wrap;
}

function placeBid(room, amount){
  loadRoom(room.code).then(fresh => {
    if (!fresh || !fresh.current) return;
    fresh.current.bid = { amount: amount, bidderId: myId, bidderName: fresh.players[myId].name };
    // Adds exactly 3 seconds on every bid
    fresh.current.endTime += 3000; 
    saveRoom(fresh);
  });
}

function placePass(room){
    loadRoom(room.code).then(fresh => {
        if (!fresh.current.passedIds) fresh.current.passedIds = [];
        if (!fresh.current.passedIds.includes(myId)) {
            fresh.current.passedIds.push(myId);
            saveRoom(fresh);
        }
    });
}

function hostTick(){
  if (!roomCode || !lastRoom || lastRoom.hostId !== myId || hostBusy) return;
  hostBusy = true;
  loadRoom(roomCode).then(room => {
    if (!room) { hostBusy = false; return; }
    
    if (room.status === "auction" && room.current) {
        var activePlayers = Object.keys(room.players).filter(id => squadCount(room.players[id]) < SQUAD_SIZE);
        var passes = room.current.passedIds ? room.current.passedIds.length : 0;
        
        // End instantly if everyone passes OR everyone except top bidder passes
        var allPassed = passes >= activePlayers.length;
        var allButBidderPassed = room.current.bid.bidderId && passes >= (activePlayers.length - 1);
        
        if (Date.now() >= room.current.endTime || allPassed || allButBidderPassed){
            if (room.current.bid.bidderId) {
                var p = PLAYERS_BY_ID[room.current.playerId];
                room.players[room.current.bid.bidderId].squad.push(p);
                room.players[room.current.bid.bidderId].budget -= room.current.bid.amount;
                room.soldInfo = { playerId: p.id, sold: true, winnerName: room.current.bid.bidderName, amount: room.current.bid.amount };
            } else {
                room.soldInfo = { playerId: room.current.playerId, sold: false };
            }
            room.status = "sold";
            saveRoom(room);
        }
    } else if (room.status === "sold" && (Date.now() - (room.updatedAt||0) >= SOLD_BANNER_MS)) {
        advanceToNextPlayer(room);
    }
    hostBusy = false;
  });
}

function renderSoldOverlay(room){
    var info = room.soldInfo;
    var overlay = el('<div class="sold-overlay"></div>');
    if (info && info.sold) {
        overlay.appendChild(el('<div class="sold-stamp">SOLD</div>'));
        overlay.appendChild(el('<div class="sold-detail">To <b>'+info.winnerName+'</b> for <b>'+fmt(info.amount)+'</b></div>'));
    } else {
        overlay.appendChild(el('<div class="sold-stamp sold-unsold">UNSOLD</div>'));
    }
    return overlay;
}

function startPolling(){
  pollTimer = setInterval(() => {
    loadRoom(roomCode).then(fresh => {
      if (!fresh) return;
      if (fresh.status === "sold" && lastRoom.status !== "sold") soldBannerUntil = Date.now() + SOLD_BANNER_MS;
      lastRoom = fresh; render();
    });
  }, POLL_MS);
  hostTimer = setInterval(hostTick, HOST_TICK_MS);
}
setInterval(() => { if (lastRoom && lastRoom.status === "auction") render(); }, 500);

render();
})();
</script>
