<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline Day — 5-a-Side Auction Draft (by Noufal)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Karla:wght@400;500;700;800&display=swap');

:root{
  --pitch-dark:#0d2818;
  --pitch:#123a22;
  --pitch-line: rgba(255,255,255,0.055);
  --parchment:#f2e8cf;
  --parchment-2:#e9dcb8;
  --ink:#1b2a20;
  --ink-soft:#4a5a4c;
  --gold:#c9a227;
  --gold-bright:#e9c34a;
  --claret:#8c2f39;
  --claret-bright:#b23a46;
  --silver:#aeb7bd;
  --panel:#163d26;
  --panel-line: rgba(242,232,207,0.12);
  --white: #f7f4ec;
  --radius: 10px;
  --font-display: 'Anton', sans-serif;
  --font-body: 'Karla', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: var(--font-body);
  color: var(--white);
  background:
    repeating-linear-gradient(90deg, var(--pitch-line) 0px, var(--pitch-line) 1px, transparent 1px, transparent 64px),
    radial-gradient(ellipse 140% 90% at 50% -10%, var(--pitch) 0%, var(--pitch-dark) 70%);
  min-height:100vh;
  background-color: var(--pitch-dark);
}
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 28px 16px 60px;
}

.eyebrow{
  font-family: var(--font-mono);
  letter-spacing: 3px;
  font-size: 11px;
  color: var(--gold-bright);
  text-transform:uppercase;
  opacity:0.9;
}
.h1{
  font-family: var(--font-display);
  font-size: clamp(34px, 6vw, 56px);
  letter-spacing: 1px;
  margin: 4px 0 0;
  line-height: 1;
  text-transform: uppercase;
  color: var(--white);
}
.h1 .accent{ color: var(--gold-bright); }
.sub{ color: var(--silver); font-size: 14px; margin-top: 8px; max-width: 480px; text-align:center; line-height:1.5;}

/* ---------- shared card/panel ---------- */
.panel{
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}
.stack{ display:flex; flex-direction:column; gap:14px; width:100%; }

input[type=text], input[type=number]{
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--panel-line);
  color: var(--white);
  font-family: var(--font-body);
  font-weight:700;
  font-size: 16px;
  padding: 12px 14px;
  border-radius: 8px;
  outline:none;
  width:100%;
  letter-spacing: 0.5px;
}
input::placeholder{ color: rgba(247,244,236,0.4); font-weight:500;}
input:focus{ border-color: var(--gold); }

button{
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.3px;
  border: none;
  border-radius: 8px;
  padding: 13px 18px;
  cursor:pointer;
  transition: transform .12s ease, filter .12s ease;
}
button:active{ transform: translateY(1px) scale(0.99); }
button:disabled{ opacity:0.35; cursor:not-allowed; filter:none !important; }

.btn-primary{ background: var(--gold); color: #201703; }
.btn-primary:hover:not(:disabled){ filter: brightness(1.08); }
.btn-claret{ background: var(--claret); color: var(--white); }
.btn-claret:hover:not(:disabled){ filter: brightness(1.12); }
.btn-ghost{ background: transparent; color: var(--white); border: 1px solid var(--panel-line); }
.btn-ghost:hover:not(:disabled){ border-color: var(--gold); color: var(--gold-bright); }
.btn-full{ width:100%; }

.card-shell{ width:100%; max-width: 480px; }

/* ---------- landing ---------- */
.landing-wrap{ display:flex; flex-direction:column; align-items:center; gap:26px; width:100%; max-width: 420px; margin-top: 18px;}
.mode-toggle{ display:flex; width:100%; background: rgba(0,0,0,0.25); border-radius: 8px; padding:4px; gap:4px; }
.mode-toggle button{ flex:1; background:transparent; color: var(--silver); padding: 10px; }
.mode-toggle button.active{ background: var(--gold); color:#201703; }

/* ---------- lobby ---------- */
.room-code-display{
  font-family: var(--font-mono);
  font-size: 34px;
  font-weight:700;
  letter-spacing: 6px;
  color: var(--gold-bright);
  text-align:center;
  padding: 14px;
  background: rgba(0,0,0,0.25);
  border-radius: 8px;
  border: 1px dashed var(--gold);
}
.roster{ display:flex; flex-direction:column; gap:8px; width:100%; }
.roster-row{
  display:flex; align-items:center; justify-content:space-between;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  padding: 10px 14px;
  font-weight:700;
}
.roster-row .tag{ font-family: var(--font-mono); font-size:11px; color: var(--gold-bright); letter-spacing:1px; }

/* ---------- auction screen ---------- */
.auction-layout{
  display:grid;
  grid-template-columns: 1fr;
  gap: 22px;
  width:100%;
  max-width: 1080px;
}
@media (min-width: 900px){
  .auction-layout{ grid-template-columns: 300px 1fr 300px; align-items:start; }
}
.topbar{
  display:flex; justify-content:space-between; align-items:center;
  width:100%; max-width:1080px; margin-bottom: 18px; flex-wrap:wrap; gap:10px;
}
.pill{
  font-family: var(--font-mono); font-size:12px; letter-spacing:1px;
  background: rgba(0,0,0,0.25); padding: 8px 14px; border-radius:20px;
  border: 1px solid var(--panel-line); color: var(--silver);
}
.pill b{ color: var(--gold-bright); }

.sticker-stage{
  perspective: 1200px;
  display:flex; flex-direction:column; align-items:center; gap:18px;
}
.sticker{
  width: 280px; height: 360px;
  border-radius: 16px;
  position:relative;
  background: linear-gradient(160deg, var(--parchment) 0%, var(--parchment-2) 100%);
  color: var(--ink);
  display:flex; flex-direction:column;
  padding: 18px;
  border: 4px solid var(--silver);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.4);
  animation: flipIn .5s cubic-bezier(.2,.9,.3,1.2);
  transform-style: preserve-3d;
}
.sticker.legend{ border-color: var(--gold); box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px var(--gold), 0 0 24px rgba(201,162,39,0.35); }
@keyframes flipIn{
  from{ transform: rotateY(90deg) scale(0.9); opacity:0; }
  to{ transform: rotateY(0deg) scale(1); opacity:1; }
}
.sticker-tier{
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform:uppercase;
  color: var(--claret); font-weight:700;
}
.sticker.legend .sticker-tier{ color: var(--gold); }
.sticker-pos{
  position:absolute; top:14px; right:14px;
  font-family: var(--font-display); font-size: 15px;
  background: var(--ink); color: var(--parchment);
  padding: 4px 10px; border-radius: 6px; letter-spacing:1px;
}
.sticker-initials{
  flex:1; display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display);
  font-size: 74px;
  color: rgba(27,42,32,0.13);
  letter-spacing: 2px;
}
.sticker-name{
  font-family: var(--font-display);
  font-size: 26px;
  line-height:1.05;
  text-transform:uppercase;
  margin-top: 4px;
}
.sticker-club{ font-size:12px; font-weight:700; color: var(--ink-soft); margin-top:2px; }

.timer{
  font-family: var(--font-mono);
  font-size: 44px; font-weight:700;
  color: var(--white);
  letter-spacing: 2px;
}
.timer.urgent{ color: var(--claret-bright); animation: pulse .5s infinite alternate; }
@keyframes pulse{ from{ opacity:1; } to{ opacity:0.55; } }

.current-bid-box{
  text-align:center;
  background: rgba(0,0,0,0.25);
  border-radius: 10px;
  padding: 14px 22px;
  min-width: 220px;
  border: 1px solid var(--panel-line);
}
.current-bid-amount{
  font-family: var(--font-display); font-size: 40px; color: var(--gold-bright); letter-spacing:1px;
}
.current-bid-by{ font-size:13px; color: var(--silver); margin-top:2px; }

.bid-controls{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; }
.bid-row{ display:flex; gap:8px; }
.bid-row button{ flex:1; }
.bid-custom{ display:flex; gap:8px; }
.bid-custom input{ flex:1; }
.bid-custom button{ white-space:nowrap; }

.sidebar-title{
  font-family: var(--font-mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color: var(--gold-bright); margin-bottom:10px;
}
.team-card{
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  border: 1px solid var(--panel-line);
}
.team-card.me{ border-color: var(--gold); }
.team-card-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.team-card-name{ font-weight:800; }
.team-card-budget{ font-family: var(--font-mono); font-size:13px; color: var(--gold-bright); }
.team-slots{ display:flex; gap:4px; flex-wrap:wrap; }
.slot{
  font-size: 10px; font-family: var(--font-mono);
  background: rgba(255,255,255,0.08);
  padding: 3px 7px; border-radius: 5px; color: var(--silver);
}
.slot.filled{ background: var(--gold); color:#201703; font-weight:700; }

/* sold overlay */
.sold-overlay{
  position:fixed; inset:0; background: rgba(5,15,9,0.88);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index: 50; gap: 10px; text-align:center; padding:20px;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.sold-stamp{
  font-family: var(--font-display); font-size: clamp(48px,10vw,90px);
  color: var(--gold-bright); letter-spacing:4px; text-transform:uppercase;
  transform: rotate(-4deg);
  border: 6px solid var(--gold-bright);
  padding: 6px 26px;
}
.sold-unsold{ color: var(--claret-bright); border-color: var(--claret-bright); }
.sold-detail{ font-size:18px; color: var(--white); font-weight:700; }
.sold-detail b{ color: var(--gold-bright); }

/* finished */
.finished-grid{
  display:grid; grid-template-columns: 1fr; gap: 18px; width:100%; max-width: 900px;
}
@media(min-width:700px){ .finished-grid{ grid-template-columns: 1fr 1fr; } }
.final-squad-title{ display:flex; justify-content:space-between; align-items:center; }
.final-player-row{ display:flex; justify-content:space-between; padding: 7px 0; border-bottom: 1px dashed var(--panel-line); font-size:14px;}
.final-player-row:last-child{ border-bottom:none; }
.crown{ font-size:12px; color: var(--gold-bright); font-family:var(--font-mono); letter-spacing:1px; }

.footnote{ font-size:12px; color: rgba(247,244,236,0.45); text-align:center; margin-top: 20px; max-width:480px; }

.error-text{ color: var(--claret-bright); font-size:13px; font-weight:700; min-height:16px; }

/* ---------- AI match simulation ---------- */
.sim-panel{ width:100%; max-width:900px; margin-top:30px; }
.sim-divider{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.sim-divider::before, .sim-divider::after{ content:""; flex:1; height:1px; background: var(--panel-line); }
.sim-cta{ display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; padding: 26px 20px; }
.spinner{
  width:26px; height:26px; border-radius:50%;
  border: 3px solid rgba(233,195,74,0.25); border-top-color: var(--gold-bright);
  animation: spin .8s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.sim-progress-track{ width:100%; height:10px; background:rgba(0,0,0,0.3); border-radius:6px; overflow:hidden; border:1px solid var(--panel-line); }
.sim-progress-bar{ height:100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); }
.sim-clock{ font-family:var(--font-mono); font-size:13px; color:var(--silver); text-align:center; }
.sim-ticker{ display:flex; flex-direction:column-reverse; gap:6px; max-height:230px; overflow-y:auto; margin-top:16px; }
.sim-ticker-item{ font-size:13px; padding:9px 12px; background: rgba(0,0,0,0.22); border-radius:6px; border-left:3px solid var(--gold); animation: tickerIn .3s ease; }
.sim-ticker-item.ft{ border-left-color: var(--claret-bright); font-weight:800; }
@keyframes tickerIn{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
.bracket{ display:flex; flex-direction:column; gap:16px; margin-top:18px; }
.bracket-round-title{ font-family:var(--font-mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-bright); }
.bracket-match{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:rgba(0,0,0,0.2); border-radius:8px; padding:10px 14px; margin-top:6px; flex-wrap:wrap; }
.bracket-match .teams{ display:flex; gap:8px; align-items:center; font-weight:700; font-size:14px; }
.bracket-match .score{ font-family: var(--font-mono); font-weight:700; color: var(--gold-bright); }
.tag{ font-family:var(--font-mono); font-size:9px; letter-spacing:1px; padding:3px 8px; border-radius:10px; text-transform:uppercase; white-space:nowrap;}
.tag-live{ background: var(--claret); color:var(--white); animation: pulse .6s infinite alternate; }
.tag-ft{ background: var(--gold); color:#201703; }
.tag-upcoming{ background: rgba(255,255,255,0.08); color: var(--silver); }
.champion-banner{ text-align:center; margin: 26px 0 10px; }
.champion-banner .trophy{ font-size:38px; display:block; margin-bottom:4px; }
.champion-banner .name{ font-family:var(--font-display); font-size: clamp(28px,6vw,42px); color:var(--gold-bright); text-transform:uppercase; letter-spacing:1px; }
.champion-banner .reason{ color:var(--silver); font-size:14px; margin-top:6px; max-width:460px; margin-left:auto; margin-right:auto; }
.analytics-grid{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:16px; }
@media(min-width:700px){ .analytics-grid{ grid-template-columns:1fr 1fr; } }
.analytics-card{ background:rgba(0,0,0,0.2); border-radius:10px; padding:14px 16px; border:1px solid var(--panel-line); }
.analytics-card.champion{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(201,162,39,0.25); }
.analytics-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; }
.analytics-name{ font-weight:800; font-size:15px; }
.analytics-rating{ font-family:var(--font-display); font-size:26px; color:var(--gold-bright); }
.analytics-line{ font-size:13px; color:var(--silver); margin-top:5px; line-height:1.4; }
.analytics-line b{ color: var(--white); }
.sim-note{ font-size:11px; color: rgba(247,244,236,0.4); text-align:center; margin-top:14px; }

@media (prefers-reduced-motion: reduce){
  .sticker, .sold-overlay, .timer.urgent{ animation: none !important; }
}
</style>
</head>

var SUPABASE_CONFIGURED = SUPABASE_URL.indexOf("YOUR_SUPABASE_URL") === -1 && SUPABASE_ANON_KEY.indexOf("YOUR_SUPABASE_ANON_KEY") === -1;

function supabaseHeaders(extra){
  var h = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  };
  if (extra){ for (var k in extra){ h[k] = extra[k]; } }
  return h;
}

function saveRoom(room){
  room.updatedAt = Date.now();
  return fetch(SUPABASE_URL + "/rest/v1/rooms?on_conflict=code", {
    method: "POST",
    headers: supabaseHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify([{ code: room.code, data: room, updated_at: new Date().toISOString() }])
  }).then(function(res){
    if (!res.ok) throw new Error("save failed: " + res.status);
    return room;
  }).catch(function(e){ console.error("save failed", e); return null; });
}

function loadRoom(code){
  return fetch(SUPABASE_URL + "/rest/v1/rooms?code=eq." + encodeURIComponent(code) + "&select=data", {
    method: "GET",
    headers: supabaseHeaders()
  }).then(function(res){
    if (!res.ok) return null;
    return res.json();
  }).then(function(rows){
    return (rows && rows.length) ? rows[0].data : null;
  }).catch(function(e){ console.error("load failed", e); return null; });
}

// ---------------- render root ----------------
function render(){
  var app = document.getElementById("app");
  app.innerHTML = "";
  if (!SUPABASE_CONFIGURED){
    app.appendChild(renderSetupNeeded());
    return;
  }
  if (!lastRoom){
    app.appendChild(renderLanding());
    return;
  }
  var room = lastRoom;
  if (room.status === "lobby"){ app.appendChild(renderLobby(room)); }
  else if (room.status === "finished"){ app.appendChild(renderFinished(room)); }
  else { app.appendChild(renderAuction(room)); }

  if (room.status === "sold" && Date.now() < soldBannerUntil){
    app.appendChild(renderSoldOverlay(room));
  }
}

function doCreateRoom(){
  var code = genCode();
  var room = {
    code: code,
    hostId: myId,
    status: "lobby",
    players: {},
    pool: [],
    poolIndex: 0,
    soldIds: [],
    current: null,
    soldInfo: null,
    simulation: null
  };
  room.players[myId] = { id: myId, name: myName, budget: BUDGET_START, squad: [] };
  saveRoom(room).then(function(res){
    if (!res){ joinError = "Couldn't create the room. Try again."; render(); return; }
    roomCode = code;
    lastRoom = room;
    startPolling();
    render();
  });
}

function doJoinRoom(code){
  loadRoom(code).then(function(room){
    if (!room){ joinError = "No room found with that code."; render(); return; }
    if (room.status !== "lobby"){ joinError = "That game has already started."; render(); return; }
    if (!room.players[myId]){
      room.players[myId] = { id: myId, name: myName, budget: BUDGET_START, squad: [] };
    }
    saveRoom(room).then(function(res){
      if (!res){ joinError = "Couldn't join. Try again."; render(); return; }
      roomCode = code;
      lastRoom = room;
      startPolling();
      render();
    });
  });
}

function doStartAuction(room){
  room.status = "auction";
  room.pool = shuffle(PLAYERS.map(function(p){return p.id;}));
  room.poolIndex = 0;
  room.soldIds = [];
  room.current = null;
  room.soldInfo = null;
  saveRoom(room).then(function(){
    advanceToNextPlayer(room);
  });
}

// ---------------- AUCTION ----------------
function advanceToNextPlayer(room){
  if (isRoomFull(room)){
    room.status = "finished";
    room.current = null;
    saveRoom(room);
    return;
  }
  while (room.poolIndex < room.pool.length && room.soldIds.indexOf(room.pool[room.poolIndex]) !== -1){
    room.poolIndex++;
  }
  if (room.poolIndex >= room.pool.length){
    room.status = "finished";
    room.current = null;
    saveRoom(room);
    return;
  }
  var pid = room.pool[room.poolIndex];
  room.poolIndex++;
  room.status = "auction";
  room.soldInfo = null;
  room.current = {
    playerId: pid,
    endTime: Date.now() + AUCTION_SECONDS*1000,
    bid: { amount: 0, bidderId: null, bidderName: null }
  };
  saveRoom(room);
}

function resolveCurrentAuction(room){
  var cur = room.current;
  if (!cur) return;
  var playerDef = PLAYERS_BY_ID[cur.playerId];
  room.soldIds.push(cur.playerId);
  if (cur.bid.bidderId && room.players[cur.bid.bidderId]){
    var buyer = room.players[cur.bid.bidderId];
    buyer.budget -= cur.bid.amount;
    buyer.squad.push({ id: playerDef.id, name: playerDef.name, pos: playerDef.pos, club: playerDef.club, tier: playerDef.tier, price: cur.bid.amount });
    room.soldInfo = { playerId: playerDef.id, sold: true, winnerName: buyer.name, amount: cur.bid.amount };
  } else {
    room.soldInfo = { playerId: playerDef.id, sold: false };
  }
  room.status = "sold";
  room.current = null;
  saveRoom(room);
}

function placeBid(room, amount){
  loadRoom(room.code).then(function(fresh){
    if (!fresh || !fresh.current || fresh.status !== "auction") return;
    var me = fresh.players[myId];
    if (!me || squadCount(me) >= SQUAD_SIZE) return;
    if (amount <= fresh.current.bid.amount) return;
    if (amount > maxAllowedBid(me)) return;
    fresh.current.bid = { amount: amount, bidderId: myId, bidderName: me.name };
    var remaining = fresh.current.endTime - Date.now();
    if (remaining < ANTI_SNIPE_WINDOW){
      fresh.current.endTime = Date.now() + ANTI_SNIPE_EXTEND;
    }
    saveRoom(fresh).then(function(){
      lastRoom = fresh;
      render();
    });
  });
}

  var info = room.soldInfo;
  var pdef = info ? PLAYERS_BY_ID[info.playerId] : null;

    overlay.appendChild(el('<div class="sold-stamp">SOLD</div>'));
    overlay.appendChild(el('<div class="sold-detail">'+escapeHtml(pdef.name)+' to <b>'+escapeHtml(info.winnerName)+'</b> for <b>'+fmt(info.amount)+'</b></div>'));
  } else if (info){
    overlay.appendChild(el('<div class="sold-stamp sold-unsold">UNSOLD</div>'));
    overlay.appendChild(el('<div class="sold-detail">No bids for '+escapeHtml(pdef.name)+'</div>'));
  }
  return overlay;
}

// ---------------- AI match simulation ----------------
function renderSimSection(room){
  var wrap = el('<div class="sim-panel"></div>');
  wrap.appendChild(el(
    '<div class="sim-divider"><span class="eyebrow" style="white-space:nowrap;">Claude AI Match Center</span></div>'
  ));

  var sim = room.simulation;
  var panel = el('<div class="panel"></div>');

  if (!sim || sim.status === "error"){
    var cta = el('<div class="sim-cta"></div>');
    cta.appendChild(el('<div class="h1" style="font-size:26px;">SIMULATE<br><span class="accent">THE FINAL</span></div>'));
    cta.appendChild(el('<div class="sub" style="margin:0;">Claude will analyze every squad, simulate a knockout bracket with live commentary, and crown a champion \u2014 all in about 20 seconds.</div>'));
    if (sim && sim.status === "error"){
      cta.appendChild(el('<div class="error-text">Something went wrong running the simulation.</div>'));
    }
    if (room.hostId === myId){
      var btn = el('<button class="btn-claret">Run AI Match Simulation</button>');
      btn.onclick = function(){ runSimulation(); };
      cta.appendChild(btn);
    } else {
      cta.appendChild(el('<div class="sub" style="margin:0;">Waiting for the host to start it\u2026</div>'));
    }
    panel.appendChild(cta);
  } else if (sim.status === "loading"){
    var loading = el('<div class="sim-cta"></div>');
    loading.appendChild(el('<div class="spinner"></div>'));
    loading.appendChild(el('<div class="sub" style="margin:0;">Claude is analyzing every squad and simulating the bracket\u2026</div>'));
    panel.appendChild(loading);
  } else if (sim.status === "running"){
    panel.appendChild(renderSimPlayback(room, sim, false));
  } else if (sim.status === "done"){
    panel.appendChild(renderSimPlayback(room, sim, true));
  }

  wrap.appendChild(panel);
  return wrap;
}

function renderSimPlayback(room, sim, finished){
  var wrap = el('<div></div>');
  var elapsed = finished ? sim.duration : (Date.now() - sim.startTime);
  var pct = Math.max(0, Math.min(100, (elapsed / sim.duration) * 100));
  var secsLeft = Math.max(0, Math.ceil((sim.duration - elapsed) / 1000));

  if (!finished){
    var progress = el('<div class="sim-progress-track"><div class="sim-progress-bar" style="width:'+pct+'%;"></div></div>');
    wrap.appendChild(progress);
    wrap.appendChild(el('<div class="sim-clock">Simulating\u2026 '+secsLeft+'s remaining</div>'));
  }

  var result = sim.result;

  // bracket
  var bracket = el('<div class="bracket"></div>');
  result.rounds.forEach(function(round){
    var rd = el('<div></div>');
    rd.appendChild(el('<div class="bracket-round-title">'+escapeHtml(round.name)+'</div>'));
    round.matches.forEach(function(m){
      var row;
      if (m.bye){
        row = el('<div class="bracket-match"><span class="teams">'+escapeHtml(m.teamAName)+'</span><span class="tag tag-upcoming">Bye</span></div>');
      } else {
        var revealed = finished || pct >= m.revealPct;
        var live = !revealed && pct >= (m.firstEventPct === undefined ? 101 : m.firstEventPct);
        if (revealed){
          row = el(
            '<div class="bracket-match"><span class="teams">'+
            '<span class="'+(m.winnerName===m.teamAName?"winner-name":"")+'">'+escapeHtml(m.teamAName)+'</span>'+
            ' <span class="score">'+m.scoreA+' \u2013 '+m.scoreB+'</span> '+
            '<span class="'+(m.winnerName===m.teamBName?"winner-name":"")+'">'+escapeHtml(m.teamBName)+'</span>'+
            '</span><span class="tag tag-ft">FT</span></div>'
          );
        } else if (live){
          row = el('<div class="bracket-match"><span class="teams">'+escapeHtml(m.teamAName)+' vs '+escapeHtml(m.teamBName)+'</span><span class="tag tag-live">Live</span></div>');
        } else {
          row = el('<div class="bracket-match"><span class="teams">'+escapeHtml(m.teamAName)+' vs '+escapeHtml(m.teamBName)+'</span><span class="tag tag-upcoming">Upcoming</span></div>');
        }
      }
      rd.appendChild(row);
    });
    bracket.appendChild(rd);
  });
  wrap.appendChild(bracket);

  // ticker
  var visibleEvents = result.ticker.filter(function(e){ return finished || e.pct <= pct; });
  var lastN = visibleEvents.slice(-10);
  var ticker = el('<div class="sim-ticker"></div>');
  lastN.forEach(function(e){
    var isFt = e.text.indexOf("full-time") !== -1;
    ticker.appendChild(el('<div class="sim-ticker-item'+(isFt?" ft":"")+'">'+escapeHtml(e.text)+'</div>'));
  });
  wrap.appendChild(ticker);

  if (finished){
    var champAnalytics = null;
    result.analytics.forEach(function(a){ if (a.team === result.champion) champAnalytics = a; });
    wrap.appendChild(el(
      '<div class="champion-banner"><span class="trophy">\ud83c\udfc6</span>'+
      '<div class="name">'+escapeHtml(result.champion)+'</div>'+
      '<div class="reason">'+escapeHtml(champAnalytics ? (champAnalytics.mvp+" led the line for a "+champAnalytics.rating+"-rated squad. "+champAnalytics.strength) : "Crowned champion of the AI-simulated final.")+'</div></div>'
    ));

    var agrid = el('<div class="analytics-grid"></div>');
    result.analytics.forEach(function(a){
      var card = el('<div class="analytics-card'+(a.team===result.champion?" champion":"")+'"></div>');
      card.appendChild(el(
        '<div class="analytics-head"><span class="analytics-name">'+escapeHtml(a.team)+(a.team===result.champion?" \ud83c\udfc6":"")+'</span><span class="analytics-rating">'+a.rating+'</span></div>'
      ));
      card.appendChild(el('<div class="analytics-line"><b>MVP:</b> '+escapeHtml(a.mvp)+'</div>'));
      card.appendChild(el('<div class="analytics-line"><b>Strength:</b> '+escapeHtml(a.strength)+'</div>'));
      card.appendChild(el('<div class="analytics-line"><b>Weakness:</b> '+escapeHtml(a.weakness)+'</div>'));
      card.appendChild(el('<div class="analytics-line"><b>Value:</b> '+escapeHtml(a.valueForMoney)+'</div>'));
      agrid.appendChild(card);
    });
    wrap.appendChild(agrid);

    if (result.usedFallback){
      wrap.appendChild(el('<div class="sim-note">Part of this simulation was generated locally (AI analysis was briefly unavailable).</div>'));
    } else {
      wrap.appendChild(el('<div class="sim-note">Simulated and analyzed by Claude \u2014 for fun, not a real prediction.</div>'));
    }
  }

  return wrap;
}

async function runSimulation(){
  var room = await loadRoom(roomCode);
  if (!room || room.hostId !== myId) return;
  room.simulation = { status: "loading" };
  await saveRoom(room);
  lastRoom = room;
  render();

  try{
    var teamIds = Object.keys(room.players);
    var teams = teamIds.map(function(id){ return room.players[id]; });
    if (teams.length < 2) throw new Error("not enough teams");

    var order = shuffle(teams.map(function(_, i){ return i; }));
    var roundsOutput = [];
    var allEventObjs = [];
    var usedFallbackAny = false;

    while (order.length > 1){
      var roundName = nameForRound(order.length);
      var pairs = [];
      for (var i=0; i<order.length; i+=2){
        if (i+1 < order.length){ pairs.push({ aIdx: order[i], bIdx: order[i+1] }); }
        else { pairs.push({ aIdx: order[i], bye: true }); }
      }
      var realPairs = pairs.filter(function(p){ return !p.bye; });
      var roundRes = realPairs.length ? await simulateRoundWithClaude(realPairs, teams) : { results: [], fallback: false };
      if (roundRes.fallback) usedFallbackAny = true;

      var matchOutputs = [];
      var winners = [];
      var ri = 0;
      pairs.forEach(function(p){
        if (p.bye){
          var byeObj = { teamAName: teams[p.aIdx].name, bye: true, revealPct: 0 };
          matchOutputs.push(byeObj);
          winners.push(p.aIdx);
        } else {
          var r = roundRes.results[ri++];
          var winnerIdx = r.winner === "B" ? p.bIdx : p.aIdx;
          var matchObj = {
            teamAName: teams[p.aIdx].name,
            teamBName: teams[p.bIdx].name,
            scoreA: r.scoreA,
            scoreB: r.scoreB,
            winnerName: teams[winnerIdx].name
          };
          matchOutputs.push(matchObj);
          r.events.forEach(function(txt){
            allEventObjs.push({ text: roundName+": "+txt, ref: matchObj, kind: "event" });
          });
          allEventObjs.push({
            text: roundName+" full-time: "+teams[p.aIdx].name+" "+r.scoreA+" \u2013 "+r.scoreB+" "+teams[p.bIdx].name,
            ref: matchObj, kind: "ft"
          });
          winners.push(winnerIdx);
        }
      });
      roundsOutput.push({ name: roundName, matches: matchOutputs });
      order = winners;
    }

    var championName = teams[order[0]].name;
    var analyticsRes = await getAnalyticsWithClaude(teams);
    if (analyticsRes.fallback) usedFallbackAny = true;

    var total = allEventObjs.length;
    var ticker = allEventObjs.map(function(o, idx){
      var pct = total > 1 ? Math.round((idx/(total-1))*100) : 0;
      if (o.kind === "ft"){ o.ref.revealPct = pct; }
      else if (o.ref.firstEventPct === undefined){ o.ref.firstEventPct = pct; }
      return { pct: pct, text: o.text };
    });
    roundsOutput.forEach(function(round){
      round.matches.forEach(function(m){
        if (!m.bye && m.revealPct === undefined) m.revealPct = 100;
      });
    });

    room.simulation = {
      status: "running",
      startTime: Date.now(),
      duration: SIM_DURATION_MS,
      result: {
        rounds: roundsOutput,
        champion: championName,
        analytics: analyticsRes.analytics,
        ticker: ticker,
        usedFallback: usedFallbackAny
      }
    };
    await saveRoom(room);
    lastRoom = room;
    render();
  } catch(err){
    console.error("simulation failed", err);
    room.simulation = { status: "error" };
    await saveRoom(room);
    lastRoom = room;
    render();
  }
}

function nameForRound(teamCount){
  if (teamCount <= 2) return "Final";
  if (teamCount === 4) return "Semi-Finals";
  if (teamCount === 8) return "Quarter-Finals";
  return "Round of " + teamCount;
}

function teamDesc(team){
  return team.name + " [" + (team.squad||[]).map(function(p){ return p.pos+": "+p.name+" ("+p.tier+")"; }).join(", ") + "]";
}

function clampInt(n, min, max){
  n = parseInt(n, 10);
  if (isNaN(n)) n = min;
  return Math.max(min, Math.min(max, n));
}

async function callClaude(prompt){
  var res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  var data = await res.json();
  var text = (data.content || []).map(function(b){ return b.text || ""; }).join("");
  var clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

async function simulateRoundWithClaude(pairs, teams){
  try{
    var lines = pairs.map(function(p, i){
      return "Match "+(i+1)+": Team A = "+teamDesc(teams[p.aIdx])+" | Team B = "+teamDesc(teams[p.bIdx]);
    }).join("\n");
    var prompt = "You are simulating 5-a-side football matches for a fantasy draft party game. "+
      "For EACH match below, simulate a realistic scoreline (0-6 goals typical per team) influenced by squad quality (legendary and star players tilt things their way) but keep some unpredictability. "+
      "Write 3-5 short vivid highlight lines per match (max ~12 words each), mentioning specific named players from that match's squads, in chronological order. "+
      "Respond with ONLY strict JSON, no markdown fences, no extra commentary, in this exact shape: "+
      '{"matches":[{"scoreA":number,"scoreB":number,"winner":"A"|"B","events":["...","..."]}]} '+
      "with one object per match, in the same order as listed, array length exactly "+pairs.length+".\n\n"+lines;

    var parsed = await callClaude(prompt);
    if (!parsed.matches || parsed.matches.length !== pairs.length) throw new Error("bad shape");
    var results = parsed.matches.map(function(m){
      return {
        scoreA: clampInt(m.scoreA, 0, 9),
        scoreB: clampInt(m.scoreB, 0, 9),
        winner: (m.winner === "B") ? "B" : "A",
        events: (Array.isArray(m.events) && m.events.length) ? m.events.slice(0,6) : ["A tightly fought contest."]
      };
    });
    return { results: results, fallback: false };
  } catch(e){
    console.error("round sim fallback", e);
    return { results: pairs.map(function(p){ return fallbackMatchResult(teams[p.aIdx], teams[p.bIdx]); }), fallback: true };
  }
}

async function getAnalyticsWithClaude(teams){
  try{
    var lines = teams.map(function(t, i){ return "Team "+(i+1)+" ("+t.name+"): "+teamDesc(t); }).join("\n");
    var prompt = "Give short scouting-report analytics for each fantasy 5-a-side football squad below. "+
      "For each team give: an overall squad rating from 1-100, the standout MVP player's name, one strength (max 10 words), one weakness (max 10 words), and a one-line value-for-money verdict (max 12 words) based on what was spent from a $50,000 budget. "+
      "Respond with ONLY strict JSON, no markdown fences, no extra text, exactly this shape with one entry per team in the SAME order as listed, array length exactly "+teams.length+": "+
      '{"analytics":[{"rating":number,"mvp":"...","strength":"...","weakness":"...","valueForMoney":"..."}]}\n\n'+lines;

    var parsed = await callClaude(prompt);
    if (!parsed.analytics || parsed.analytics.length !== teams.length) throw new Error("bad shape");
    var analytics = parsed.analytics.map(function(a, i){
      return {
        team: teams[i].name,
        rating: clampInt(a.rating, 1, 100),
        mvp: a.mvp || ((teams[i].squad[0] && teams[i].squad[0].name) || "\u2014"),
        strength: a.strength || "Balanced squad.",
        weakness: a.weakness || "Squad depth untested.",
        valueForMoney: a.valueForMoney || "Reasonable business overall."
      };
    });
    return { analytics: analytics, fallback: false };
  } catch(e){
    console.error("analytics fallback", e);
    return { analytics: teams.map(function(t){ return fallbackAnalytics(t); }), fallback: true };
  }
}

function teamPower(team){
  var val = 0;
  (team.squad||[]).forEach(function(p){ val += (p.tier === "Legend" ? 3 : 2); });
  return val || 1;
}
function pickRandomPlayers(team, count){
  var pool = (team.squad && team.squad.length) ? team.squad : [{ name: team.name+"'s squad" }];
  var out = [];
  for (var i=0;i<count;i++){ out.push(pool[Math.floor(Math.random()*pool.length)]); }
  return out;
}
function fallbackMatchResult(a, b){
  var pa = teamPower(a), pb = teamPower(b);
  var sa = Math.max(0, Math.round(pa/3 + Math.random()*3));
  var sb = Math.max(0, Math.round(pb/3 + Math.random()*3));
  if (sa === sb){ if (Math.random() < 0.5) sa++; else sb++; }
  var events = [];
  pickRandomPlayers(a, sa).forEach(function(p){ events.push(p.name+" finishes well for "+a.name+"!"); });
  pickRandomPlayers(b, sb).forEach(function(p){ events.push(p.name+" strikes for "+b.name+"!"); });
  events = shuffle(events);
  if (events.length === 0) events.push("A goalless stalemate between "+a.name+" and "+b.name+".");
  return { scoreA: sa, scoreB: sb, winner: sa >= sb ? "A" : "B", events: events.slice(0,6) };
}
function fallbackAnalytics(t){
  var power = teamPower(t);
  var rating = clampInt(40 + power*4 + Math.floor(Math.random()*10), 30, 96);
  var sorted = (t.squad||[]).slice().sort(function(x,y){ return (y.price||0)-(x.price||0); });
  var mvpPlayer = sorted[0];
  var spent = BUDGET_START - t.budget;
  var hasGk = (t.squad||[]).some(function(p){ return p.pos === "GK"; });
  return {
    team: t.name,
    rating: rating,
    mvp: mvpPlayer ? mvpPlayer.name : "\u2014",
    strength: power > 10 ? "Star quality up top." : "Well-balanced squad spending.",
    weakness: hasGk ? "Limited squad depth." : "No specialist goalkeeper.",
    valueForMoney: spent < BUDGET_START*0.6 ? "Shrewd, cost-effective business." : "Spent big \u2014 needs the end product."
  };
}

// ---------------- polling / host loop ----------------
function startPolling(){
  stopPolling();
  pollTimer = setInterval(pollTick, POLL_MS);
  hostTimer = setInterval(hostTick, HOST_TICK_MS);
}
function stopPolling(){
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  if (hostTimer){ clearInterval(hostTimer); hostTimer = null; }
}
function pollTick(){
  if (!roomCode) return;
  loadRoom(roomCode).then(function(fresh){
    if (!fresh) return;
    var wasStatus = lastRoom ? lastRoom.status : null;
    lastRoom = fresh;
    if (fresh.status === "sold" && wasStatus !== "sold"){
      soldBannerUntil = Date.now() + SOLD_BANNER_MS;
    }
    render();
  });
}
function hostTick(){
  if (!roomCode || !lastRoom || lastRoom.hostId !== myId || hostBusy) return;
  hostBusy = true;
  loadRoom(roomCode).then(function(room){
    if (!room){ hostBusy = false; return; }
    if (room.status === "auction" && room.current && Date.now() >= room.current.endTime){
      resolveCurrentAuction(room);
    } else if (room.status === "sold"){
      var soldAt = room.updatedAt || 0;
      if (Date.now() - soldAt >= SOLD_BANNER_MS){
        advanceToNextPlayer(room);
      }
    } else if (room.status === "finished" && room.simulation && room.simulation.status === "running"){
      var elapsedSim = Date.now() - room.simulation.startTime;
      if (elapsedSim >= room.simulation.duration){
        room.simulation.status = "done";
        saveRoom(room);
      }
    }
    hostBusy = false;
  }).catch(function(){ hostBusy = false; });
}

// countdown-only re-render tick (smooth timer / ticker without full poll)
setInterval(function(){
  if (!lastRoom) return;
  if (lastRoom.status === "auction" && lastRoom.current){ render(); }
  else if (lastRoom.status === "finished" && lastRoom.simulation && lastRoom.simulation.status === "running"){ render(); }
}, 500);

function leaveRoom(){
  stopPolling();
  lastRoom = null;
  roomCode = "";
  joinError = "";
  render();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

render();
})();
</script>
